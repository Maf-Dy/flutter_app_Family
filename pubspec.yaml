name: family_game
description: "Family: a party game where everyone secretly drops a name in the bowl."
publish_to: 'none'

version: 2.0.0+10

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  connectivity_plus: ^7.3.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  permission_handler: ^13.0.2
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
    - family: Kalam
      fonts:
        - asset: assets/fonts/Kalam-Bold.ttf
          weight: 700
    # Arabic: used as a fallback, so Arabic text in either language renders.
    - family: Baloo Bhaijaan 2
      fonts:
        - asset: assets/fonts/BalooBhaijaan2-Regular.ttf
          weight: 400
        - asset: assets/fonts/BalooBhaijaan2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BalooBhaijaan2-Bold.ttf
          weight: 700
        - asset: assets/fonts/BalooBhaijaan2-ExtraBold.ttf
          weight: 800
    - family: Aref Ruqaa
      fonts:
        - asset: assets/fonts/ArefRuqaa-Bold.ttf
          weight: 700

  assets:
    - assets/fonts/OFL-bricolagegrotesque.txt
    - assets/fonts/OFL-nunito.txt
    - assets/fonts/OFL-kalam.txt
    - assets/fonts/OFL-baloobhaijaan2.txt
    - assets/fonts/OFL-arefruqaa.txt
